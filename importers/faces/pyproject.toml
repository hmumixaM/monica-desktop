[project]
name = "monica-faces"
version = "0.1.0"
description = "Local face detection and matching for Monica Next; embeddings never leave this machine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "insightface==0.7.3",
    # Newer onnx has no wheel for macOS 12 x86_64 and fails to build.
    "onnx==1.16.2",
    "onnxruntime==1.19.2",
    "opencv-python-headless==4.10.0.84",
    "numpy>=1.26,<2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
]

[project.scripts]
monica-faces = "monica_faces.run:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
