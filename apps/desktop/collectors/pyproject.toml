[project]
name = "monica-desktop-collectors"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "instaloader==4.15.3",
  "playwright==1.62.0",
  "pydantic==2.13.4",
  "linkedin-scraper @ git+https://github.com/joeyism/linkedin_scraper.git@b1cdc1c0e85bee8764d62565d229c682e5eb81bb",
  "linkedin-cli==0.1.dev27",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pillow>=11,<13",
    "pytest>=8.3,<9",
]

[tool.uv.sources]
linkedin-cli = { path = "vendor/linkedin_cli_package" }
